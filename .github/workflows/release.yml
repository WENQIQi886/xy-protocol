# ============================================================================
# Release 流水线：打 tag 后自动发布 GitHub Release + 容器镜像
# 版本规范: Semantic Versioning (vX.Y.Z)
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 发布 Release 与镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: 校验版本格式
        run: |
          echo "${{ steps.version.outputs.TAG }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::版本号必须符合 SemVer: vX.Y.Z"; exit 1; }

      - name: 生成 Release 说明
        id: notes
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "release_body=$(cat CHANGELOG.md | head -50)" >> "$GITHUB_OUTPUT"
          else
            echo "release_body=Release ${{ steps.version.outputs.TAG }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Param Imaging ${{ steps.version.outputs.TAG }}
          body: ${{ steps.notes.outputs.release_body }}
          generate_release_notes: true

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.TAG }}
          build-args: |
            SEED=0x612
          cache-from: type=gha
          cache-to: type=gha,mode=max
