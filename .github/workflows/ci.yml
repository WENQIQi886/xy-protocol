# ============================================================================
# CI 流水线：数据校验 + 依赖安全扫描 + 镜像构建（六西格玛测量/控制阶段）
# 触发：push 到 main、PR、手动
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  workflow_dispatch:

env:
  SEED: '0x612'
  PYTHON_VERSION: '3.10.13'

jobs:
  verify-data:
    name: 数据哈希链校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验数据完整性
        run: |
          if [ -f checksums.sha256 ] && [ -s checksums.sha256 ] && grep -qE '^[0-9a-f]{64}  ' checksums.sha256; then
            sha256sum -c checksums.sha256
          else
            echo "::warning::checksums.sha256 无有效哈希行，跳过数据校验"
          fi

  lint-deps:
    name: 依赖锁定与安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查依赖锁定文件
        run: |
          test -f requirements.txt || { echo "::error::requirements.txt 缺失"; exit 1; }
          echo "==> requirements.txt 存在"
          cat requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 依赖锁定一致性
        run: |
          pip install --no-cache-dir -r requirements.txt
          echo "==> 依赖锁定版本安装成功"

  docker-build:
    name: 镜像构建冒烟
    runs-on: ubuntu-latest
    needs: [verify-data, lint-deps]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: xy-protocol:ci-${{ github.sha }}
          build-args: |
            SEED=${{ env.SEED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
